name: Keep Supabase Active

on:
  schedule:
    # Runs daily at 09:00 JST. GitHub Actions cron uses UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Read one row from Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${NEXT_PUBLIC_SUPABASE_URL}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" ]; then
            echo "Required Supabase secrets are not configured."
            exit 1
          fi

          response_file="$(mktemp)"

          http_status=$(curl \
            --silent \
            --show-error \
            --output "${response_file}" \
            --write-out "%{http_code}" \
            --request GET \
            "${NEXT_PUBLIC_SUPABASE_URL}/rest/v1/videos?select=id&limit=1" \
            --header "apikey: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" \
            --header "Authorization: Bearer ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}")

          echo "Supabase returned HTTP ${http_status}"

          if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
            echo "Supabase request failed:"
            cat "${response_file}"
            exit 1
          fi

          echo "Supabase project responded successfully."
